      when: The Subtract button is pressed
      then: The answer label shows -2
  ambiguities: []
  depends_on:
    - REQ-DEMO-001
    - REQ-DEMO-003
  belts: [A, B]

- id: REQ-DEMO-005
  title: Pressing the close button asks the browser to close the tab
  module: DEMO
  priority: must
  status: agreed
  version: 2
  source: >-
    CHG-0003 (FB-0003, 2026-10-07) — "ADD A CLOSE (x) ON TOP RIGHT corner";
    CHG-0006 (FB-0004, 2026-10-07) — "closebutton will close this"; clarified by
    Kartik Chandra Biswas in build session 2026-10-07 (try to close the tab,
    chosen knowing browsers usually refuse for a tab the user opened)
  rationale: >-
    The client wants the x to close the Calculator's tab. A page can only ask;
    browsers close a tab only when a script opened it, and otherwise ignore the
    request. When the browser refuses, nothing happens and the Calculator stays
    as it was. That trade-off was chosen knowingly.
  acceptance:
    - given: The Calculator is open in a tab the browser lets the page close
      when: The close button is pressed
      then: The tab closes
    - given: The first text box holds 3, the second holds 4, and Add has been pressed so the answer label shows 7
      when: The close button is pressed in a tab the browser will not let the page close
      then: The text boxes still hold 3 and 4 and the answer label still shows 7
  ambiguities: []
  depends_on:
    - REQ-DEMO-001
  belts: [A, B]
  history:
    - version: 1
      agreed: 2026-10-07
      superseded_by: 2
      summary: >-
        v1 said pressing the close button clears both text boxes and the answer
        label, and everything stays visible (the client's answer "Clear
        everything"). Superseded by CHG-0006 (absorbed), which makes it try to
        close the tab instead.

