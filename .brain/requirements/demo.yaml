- id: REQ-DEMO-001
  title: A single page shows two text boxes, four operation buttons, a close button and one answer label
  module: DEMO
  priority: must
  status: agreed
  version: 4
  source: >-
    BRIEF.md 2026-10-01 — "single page application ... just two text box and a
    button, answer will be shown in a label"; CHG-0001 (FB-0001, 2026-10-01) —
    "a beautiful background, noce add button and lebel textbox apearence is also
    nice all aligned in same point"; alignment clarified as a centred column by
    Kartik Chandra Biswas in build session 2026-10-01; CHG-0002 (FB-0002,
    2026-10-07) — "add substraction"; clarified by Kartik Chandra Biswas in build
    session 2026-10-07 (second button, side by side, labelled Add and Subtract);
    CHG-0003, CHG-0004, CHG-0005 (FB-0003, 2026-10-07) — "ADD A CLOSE (x) ON TOP
    RIGHT corner. And al;so add multiply and Division"; clarified by Kartik
    Chandra Biswas in build session 2026-10-07 (close in the card's top right;
    Multiply and Divide labels; one row of four)
  rationale: >-
    The calculator is for a child. The screen holds only the controls the child
    needs, so there is nothing else to distract or confuse. FB-0001 asks that
    those controls look like something a child would like, on an attractive
    background, lined up in one column. FB-0002 adds subtraction, and FB-0003
    adds multiplication, division and a close (x) that clears the Calculator.
  acceptance:
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: >-
        Exactly two text boxes, five buttons (four operation buttons and one close
        button) and one answer label are visible on a single page
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: >-
        The four operation buttons show the text "Add", "Subtract", "Multiply" and
        "Divide", and the close button shows an x
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: >-
        The first text box, the second text box, the row of operation buttons and
        the answer label are stacked top to bottom in that order, and the
        horizontal centre of each is the horizontal centre of the page
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: >-
        Add, Subtract, Multiply and Divide sit side by side on one row, in that
        order from left to right, with their tops level
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: >-
        The close button sits inside the white card that holds the controls, in its
        top right corner: its right edge is nearer the card's right edge than the
        first text box's right edge is, and its top is above the first text box
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: The page background is not plain white
    - given: The calculator page is opened in a browser
      when: The page has loaded
      then: >-
        Each button, each text box and the answer label each have a background
        colour, a border and a font size that differ from the browser's default
        for that control
  ambiguities: []
  belts: [A, B]
  history:
    - version: 1
      agreed: 2026-10-01
      superseded_by: 2
      summary: >-
        v1 required only that two text boxes, one button and one answer label be
        visible on a single page, and said nothing about appearance or layout.
        Verified 2026-10-01 by tests/calculator.spec.js and e2e/calculator.spec.js.
        Superseded by CHG-0001 (absorbed), which adds a centred column, a
        non-white background and styled controls.
    - version: 2
      agreed: 2026-10-01
      superseded_by: 3
      summary: >-
        v2 required exactly two text boxes, one button and one answer label in a
        centred column, on a non-white background, with styled controls.
        Verified by tests/calculator.spec.js and e2e/calculator.spec.js.
        Superseded by CHG-0002 (absorbed), which adds a Subtract button beside
        the Add button.
    - version: 3
      agreed: 2026-10-07
      superseded_by: 4
      summary: >-
        v3 required exactly two text boxes, two buttons (Add and Subtract, side by
        side) and one answer label in a centred column, on a non-white background,
        with styled controls. Verified by tests/calculator.spec.js and
        e2e/calculator.spec.js. Superseded by CHG-0003, CHG-0004 and CHG-0005
        (all absorbed), which add Multiply and Divide to the row and a close (x)
        in the card's top right corner.

- id: REQ-DEMO-002
  title: Pressing the Add button shows the sum of the two Numbers in the answer label
  module: DEMO
  priority: must
  status: verified
  verified_by:
    - e2e/calculator.spec.js
    - tests/calculator.spec.js
  version: 2
  source: >-
    BRIEF.md 2026-10-01 — "only can add two numbers ... giving right input just
    show them a simple addition"; CHG-0002 (FB-0002, 2026-10-07) — "add
    substraction"; clarified by Kartik Chandra Biswas in build session 2026-10-07
    (second button labelled Subtract)
  rationale: >-
    Adding two Numbers is one of the Calculator's two purposes. CHG-0002 adds a
    Subtract button, so this requirement now names the Add button.
  acceptance:
    - given: The first text box holds 3 and the second holds 4
      when: The Add button is pressed
      then: The answer label shows 7
    - given: The first text box holds 0 and the second holds 5
      when: The Add button is pressed
      then: The answer label shows 5
  ambiguities: []
  depends_on:
    - REQ-DEMO-001
    - REQ-DEMO-003
  belts: [A, B]
  history:
    - version: 1
      agreed: 2026-10-01
      superseded_by: 2
      summary: >-
        v1 said pressing "the button" (the only one) shows the sum, and that
        adding was the one and only purpose. Verified by tests/calculator.spec.js
        and e2e/calculator.spec.js. Superseded by CHG-0002 (absorbed), which adds
        a Subtract button.

- id: REQ-DEMO-003
  title: Each text box accepts only whole Numbers of zero or more, so invalid input cannot be entered
  module: DEMO
  priority: must
  status: verified
  verified_by:
    - e2e/calculator.spec.js
    - tests/calculator.spec.js
  version: 1
  source: BRIEF.md 2026-10-01 — "no negative number will be acceptable, on we a whole number not decimal ... no way to get invalid input"
  rationale: >-
    The brief says invalid input must be impossible rather than reported. A
    child should never see an error; they simply cannot type anything but a
    whole Number.
  acceptance:
    - given: A text box is empty
      when: The child types a minus sign
      then: The text box remains empty
    - given: A text box holds 12
      when: The child types a decimal point
      then: The text box still holds 12
    - given: A text box is empty
      when: The child types a letter
      then: The text box remains empty
    - given: A text box is empty
      when: The child types 25
      then: The text box holds 25
  ambiguities: []
  depends_on:
    - REQ-DEMO-001
  belts: [A, B]

- id: REQ-DEMO-004
