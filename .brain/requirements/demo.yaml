- id: REQ-DEMO-007
  title: Pressing the Divide button shows the first Number divided by the second, rounded to 2 decimal places
  module: DEMO
  priority: must
  status: agreed
  version: 2
  source: >-
    CHG-0005 (FB-0003, 2026-10-07) — "add ... Division"; CHG-0007 and CHG-0008
    (FB-0004, 2026-10-07) — "divition will not show like (0 r 3434) the real
    result will be here, and div by zero will give a message with clearing
    rtesult"; clarified by Kartik Chandra Biswas in build session 2026-10-07
    (decimal, 2 places; message "Oops! You can't divide by zero"; nothing else
    cleared)
  rationale: >-
    The client wants the real result of a division, as a decimal rounded to 2
    places with no trailing zeros, so an exact result still shows as a whole
    number. Dividing by 0 has no Answer; the answer label shows a friendly
    message instead, and the text boxes are left as they are.
  acceptance:
    - given: The first text box holds 6 and the second holds 2
      when: The Divide button is pressed
      then: The answer label shows 3
    - given: The first text box holds 7 and the second holds 2
      when: The Divide button is pressed
      then: The answer label shows 3.5
    - given: The first text box holds 3434 and the second holds 5000
      when: The Divide button is pressed
      then: The answer label shows 0.69
    - given: The first text box holds 1 and the second holds 3
      when: The Divide button is pressed
      then: The answer label shows 0.33
    - given: The first text box holds 5 and the second holds 0
      when: The Divide button is pressed
      then: The answer label shows "Oops! You can't divide by zero"
    - given: The first text box holds 5 and the second holds 0
      when: The Divide button is pressed
      then: The text boxes still hold 5 and 0
  ambiguities: []
  depends_on:
    - REQ-DEMO-001
    - REQ-DEMO-003
  belts: [A, B]
  history:
    - version: 1
      agreed: 2026-10-07
      superseded_by: 2
      summary: >-
        v1 showed a whole number and remainder ("3 r 1"; "3" when exact) and an
        empty answer label when dividing by 0 (the client's answers "3 r 1" and
        "Show nothing"). Superseded by CHG-0007 (decimal, 2 places) and CHG-0008
        (a message for dividing by 0), both absorbed.
