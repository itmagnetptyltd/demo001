      ---
      
      **[contradicts] A2: The Calculator can multiply the two Numbers.**
      - REQ-DEMO-001@v3 c1: "Exactly two text boxes, two buttons and one answer label are visible on a single page"
      - REQ-DEMO-001@v3 c2: "One button shows the text "Add" and the other shows the text "Subtract""
      - Why: c1 and c2 fix the page at exactly two buttons, Add and Subtract, so there is no agreed place for a way to start a multiplication. Even a dropdown would be a visible control that c1 does not allow.
      - Not covered either: REQ-DEMO-002@v2 requires only the sum and REQ-DEMO-004@v1 requires only the first Number minus the second. No criterion mentions a product.
      - The original brief ("only can add two numbers") points the same way. However, that limit was already varied once, when subtraction was added under CHG-0002, so on its own it is weak evidence.
      - Agreed text that would have to change:
        - REQ-DEMO-001@v3: the title, c1 (button count), c2 (button labels), c3 ("the row of buttons" still works) and c4 ("The Add and Subtract buttons sit side by side on one row, Add on the left").
        - Glossary **Calculator**: "an Add button, a Subtract button".
        - Glossary **Answer**: "the sum after Add … or the first Number minus the second after Subtract".
      - Open questions no agreed text answers:
        - What the button says ("Multiply", "×" or "x") and where it sits in the row.
        - Whether all buttons must stay on one row.
        - Whether there is any limit on how big an Answer can be. Nothing caps the size of a Number.
      
      **[contradicts] A3: The Calculator can divide the first Number by the second.**
      - Citations: the same as A2, REQ-DEMO-001@v3 c1 and c2. No criterion in REQ-DEMO-002@v2 or REQ-DEMO-004@v1 asks for a quotient.
      - Agreed text that would have to change: the same as A2.
      - Open questions no agreed text answers. This is where the ask is least defined:
        1. **Division by zero.** REQ-DEMO-003@v1 c4 and the glossary **Number** ("zero or more") both allow 0 as the second Number. Nothing says what should be shown.
        2. **Results that are not whole numbers**, for example 7 ÷ 2. The glossary **Answer** allows negatives but says nothing about decimals. The brief says "whole number not decimal", but that is about input. Should the Answer show 3.5, 3, or 3 remainder 1? If it rounds, which way?
        3. What the button says and where it goes, as for A2.
      
      **[contradicts] A1: A close control, shown as "x", in the top right corner.**
      - REQ-DEMO-001@v3 c1: "Exactly two text boxes, two buttons and one answer label are visible on a single page"
      - REQ-DEMO-001@v3 c3: "The first text box, the second text box, the row of buttons and the answer label are stacked top to bottom in that order"
      - Glossary **Calculator**: "the single page holding two text boxes, an Add button, a Subtract button and one answer label. There is no other page."
      - Why: a clickable "x" is a third button, which breaks c1. c3 and the glossary list everything on the page and leave no top-right element.
      - Caveat: if it were built as something other than a button, c1 strictly counts only text boxes, buttons and labels. Even then, the glossary's list of what the page holds and the rationale ("holds only the controls the child needs") still exclude it. Nothing requires it either way.
      - Agreed text that would have to change: REQ-DEMO-001@v3 title, c1 and c3, and the glossary **Calculator**. c6 would also need a decision on whether its styling rules apply to the "x".
      - Open questions no agreed text answers:
