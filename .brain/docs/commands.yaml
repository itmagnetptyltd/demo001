      ## Scope verdicts for the client's 2026-10-07 ask
      
      None of the three asks is required by any agreed criterion. All three also conflict with agreed text, so I have called each one `contradicts`. One point matters for how this is shown to the client: the conflict is with the agreed screen layout ("exactly two buttons", named "Add" and "Subtract"). The client never said "no multiply", "no divide" or "no close button" in so many words.
      
