      ## Scope verdicts for the client's 2026-10-07 asks
      
      I judged these only against the texts you gave me. I opened no files. Two of the three asks, and part of the third, go against the client's own choices in ANSWERS.md from earlier on the same day (2026-10-07). On each of those points the client was offered the option they are now asking for and picked a different one.
      
      The client's sentence held four separate requests, so I judged A3 as two items: the message (A3a) and the clearing (A3b). Most commercially significant first.
      
      ---
      
      **[contradicts] A2: Divide should show "the real result" instead of a whole number and remainder like "0 r 3434"**
      - REQ-DEMO-007@v1 title: "shows the first Number divided by the second, as a whole number and remainder". The rationale says: "a child learns division as a whole number and a remainder."
      - REQ-DEMO-007@v1 c2: "7 and 2, Divide -> answer label shows 3 r 1"
      - REQ-DEMO-007@v1 c1: "6 and 2, Divide -> answer label shows 3"
      - Glossary, Answer: "the first Number divided by the second as a whole number followed by " r " and the remainder when the remainder is not 0, e.g. "3 r 1""
      - ANSWERS.md, 2026-10-07: "What shows when dividing gives a part number, e.g. 7 ÷ 2? (3 r 1 / 3.5 / 3)" > **3 r 1**. The decimal option "3.5" was offered and not chosen.
      - Why: the agreed text requires the whole-number-and-remainder form. "0 r 3434" is exactly what that rule gives when the first Number (3434) is smaller than the second: whole part 0, remainder 3434, and the remainder is not 0 so it is shown. Any other "real result", whether a decimal or anything else, replaces the agreed format.
      - Agreed text that would have to change: REQ-DEMO-007@v1 (title, rationale, c2, and c1 if exact results change form), the glossary entry for Answer, and the ANSWERS.md entry above, which would need a new recorded answer.
      - Questions no agreed text answers:
        - What is "the real result"? A decimal, and if so how many places and with what rounding? A fraction? Just the whole number?
        - Does the change apply to every division, or only when the whole part is 0?
        - The brief says "whole number not decimal". It is unclear whether that was about the inputs only (that is how REQ-DEMO-003 and the glossary Number read it) or about Answers too. If it covered Answers, a decimal Answer also goes against the brief.
      - I could not evaluate one possibility. If "0 r 3434" appeared for inputs where the first Number is not smaller than the second (say 3434 and 2), that is a wrong result under c1/c2 and is covered, not a variation. The client's words do not give the inputs. Ask them which two Numbers produced "0 r 3434".
      
      **[contradicts] A3a: Dividing by zero should show a message**
      - REQ-DEMO-007@v1 c3: "5 and 0, Divide -> the answer label is empty"
      - REQ-DEMO-007@v1 rationale: "Dividing by 0 has no Answer, so nothing is shown."
      - Glossary, Answer: "Dividing by 0 has no Answer."
      - ANSWERS.md, 2026-10-07: "What shows when dividing by 0, e.g. 5 ÷ 0? (show nothing / friendly message)" > **Show nothing**. "Friendly message" was offered and not chosen.
      - Why: a message in the answer label directly breaks c3. A message anywhere else still breaks the rationale's "nothing is shown". If it appeared as a separate element, it would also touch REQ-DEMO-001@v4 c1: "Exactly two text boxes, five buttons ... and one answer label are visible on a single page".
      - Agreed text that would have to change: REQ-DEMO-007@v1 c3 and rationale, the glossary entry for Answer ("Dividing by 0 has no Answer"), the ANSWERS.md entry above, and possibly REQ-DEMO-001@v4 c1, depending on where the message goes.
      - Questions no agreed text answers: the wording of the message; where it appears (in the answer label or as a separate element or pop-up); and whether it stays until the next button press or goes away on its own.
      
      **[contradicts] A1: The close button should "close this" rather than clear the Calculator**
      - REQ-DEMO-005@v1 title: "Pressing the close button clears both text boxes and the answer label"
      - REQ-DEMO-005@v1 rationale: "There is no other page to close to. The close (x) lets a child start again: it empties the Calculator rather than hiding it."
      - REQ-DEMO-005@v1 c2: "Given the close button has been pressed, then the two text boxes, the four operation buttons, the close button and the answer label are still visible"
      - Glossary, Close button: "It clears both text boxes and the answer label; it does not close or hide anything."
      - Glossary, Calculator: "There is no other page."
      - ANSWERS.md, 2026-10-07: "What should pressing the close (x) do? (clear everything / hide the Calculator / close the tab)" > **Clear everything**. Hiding and closing were both offered and not chosen.
      - Why: closing or hiding is the opposite of c2, which requires everything to stay visible.
      - Agreed text that would have to change: REQ-DEMO-005@v1 (title, rationale, c1, c2), the glossary entry for Close button and possibly Calculator ("There is no other page"), and the ANSWERS.md entry above. REQ-DEMO-001@v4 c1/c2/c5 would only change if the button were removed or moved.
      - Questions no agreed text answers:
        - What does "this" mean: the Calculator (hidden), the browser tab, or something else?
        - After a hide, how does the Calculator come back? No agreed text gives a way, because there is no other page.
        - The client's words are ambiguous. "closebutton will close this" could just be describing the button. Then "clearing rtesult" at the end of the sentence might be about the close button rather than divide by zero. If the client only means "the close button clears", that is already covered by REQ-DEMO-005@v1 c1. Confirm which they mean before treating this as a variation.
      
      **[partial] A3b: Dividing by zero should clear the result**
      - Covered half (clearing the answer label): REQ-DEMO-007@v1 c3 says "5 and 0, Divide -> the answer label is empty". That requires the label to be empty after dividing by 0, including when it held an earlier Answer.
      - Not-covered half (clearing the text boxes, if "result" includes them): REQ-DEMO-007@v1 says nothing about the text boxes. The only agreed text that clears the text boxes is REQ-DEMO-005@v1 c1, and it applies to the close button only.
      - Agreed text that would have to change: none for the covered half. Clearing the text boxes needs a new criterion, for example on REQ-DEMO-007. Showing a message at the same time as an emptied label (A3a) conflicts with c3.
      - Questions no agreed text answers: does "clearing result" mean only the answer label, or the text boxes as well? If the message goes in the answer label, the label is not "cleared", so A3a and A3b pull against each other in the client's own sentence.
      
