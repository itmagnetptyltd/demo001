      VERDICT: contradicts. The ask is "add substraction" (A1, client, 2026-10-07): the Calculator should be able to subtract.
      
      Evidence that the client agreed the opposite:
      1. ORIGINAL BRIEF (client's own words, verbatim): "create a simple (single page application) calculator only can add two numbers for a child."
         The word "only" limits the Calculator to addition. Subtraction is excluded by name, not just left out.
      2. REQ-DEMO-002@v1 (verified). Title: "Pressing the button shows the sum of the two Numbers in the answer label". Source: BRIEF.md "only can add two numbers ... giving right input just show them a simple addition". Rationale: "The one and only purpose of the calculator is adding two Numbers."
         The agreed record says addition is the only purpose. That is an explicit exclusion.
      3. GLOSSARY: "Answer = the sum of the two Numbers."
         The agreed term defines the Answer as a sum and nothing else.
      
      At minimum, nothing requires the ask. No criterion in REQ-DEMO-001@v2 (c1–c4), REQ-DEMO-002@v1 (c1–c2) or REQ-DEMO-003@v1 (c1–c4) requires subtraction. 002 c1 ("first 3, second 4, button pressed -> answer label shows 7") and c2 ("first 0, second 5 ... shows 5") only test sums. The rationale and brief go further than silence: they rule subtraction out, which is why the verdict is contradicts and not just not-covered.
      
      Agreed text that building the ask would force to change:
      - REQ-DEMO-001@v2 c1: "Exactly two text boxes, one button and one answer label are visible on a single page". Choosing between add and subtract needs a second button or another control (a selector or toggle). Either breaks "exactly ... one button" and the four-control limit, and the rationale says "The brief limits the screen to exactly these four controls". c2 (the fixed stacking order of four controls) would also need revising.
      - REQ-DEMO-002@v1 c1/c2 and title: "Pressing the button shows the sum". If the single button sometimes subtracts, these criteria are no longer always true. The title, source and rationale ("one and only purpose ... adding") would have to be superseded.
      - GLOSSARY "Answer": would have to be redefined beyond "the sum of the two Numbers". The "Calculator" entry also fixes "one button".
      - Non-negative rule: the brief says "no negative number will be acceptable", and the glossary says Number is "never negative". 3 - 5 = -2 gives a negative answer. REQ-DEMO-003@v1 c1 (typing a minus sign is refused) restricts input only, but the brief's ban on negative numbers and the child audience conflict with a negative answer. Building this needs a client decision on what happens when the second Number is larger: refuse it, show an error, allow a negative answer, or something else. No agreed text answers that, so it would be a new ambiguity to record, not something to resolve by picking an option.
      
      Count: contradicts 1, covered 0, partial 0, not-covered 0.
      
      What I could not check: you told me to use only the texts above, so I did not open ANSWERS.md, the history of each requirement, change records or the feedback ledger. I cannot confirm whether:
      - an earlier version of any requirement included subtraction,
      - the client answered a question about operations,
      - this ask is already recorded as a feedback or change item.
      If any of those exist, they should be checked before this goes to the client. The source path is D:\practice\demo001\.brain\requirements\demo.yaml. The material contained no embedded instructions.
